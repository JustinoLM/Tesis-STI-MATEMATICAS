# Configuración de Alembic para migraciones de base de datos

[alembic]
# Ruta al directorio de scripts de migración
script_location = alembic

# Template para nombres de archivos de migración
# Formato: YYYY-MM-DD_HHMM_descripcion.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Ruta a env.py
prepend_sys_path = .

# Timezone (UTC recomendado)
timezone = UTC

# Truncar slug a N caracteres
truncate_slug_length = 40

# Número de revisión
revision_environment = false

# Formato de IDs de revisión (hex, uuid, etc.)
# Por defecto usa timestamps + hash corto
sourceless = false

# Versión mínima de SQLAlchemy
# sqlalchemy_version_min = 2.0

# URL de la base de datos
# IMPORTANTE: Se sobrescribe desde env.py usando variables de entorno
# sqlalchemy.url = postgresql://user:pass@localhost/dbname

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
