[tool.poetry]
name = "sti-backend"
version = "0.1.0"
description = "Backend del Sistema de Tutoría Inteligente"
authors = ["Justin"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
sqlalchemy = "^2.0.23"
alembic = "^1.12.1"
psycopg2-binary = "^2.9.9"
pydantic = {extras = ["email"], version = "^2.5.0"}
pydantic-settings = "^2.1.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["argon2"], version = "^1.7.4"}
python-multipart = "^0.0.6"
httpx = "^0.25.2"
asyncpg = "^0.31.0"
aiosqlite = "^0.22.1"
greenlet = "^3.3.0"
bcrypt = ">=4.0.0"
scikit-learn = "^1.8.0"
pandas = "^2.3.3"
numpy = "^2.4.0"
joblib = "^1.5.3"
apscheduler = "^3.11.2"
openpyxl = "^3.1.5"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
black = "^23.12.0"
ruff = "^0.1.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
